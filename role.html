<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saqtas — Волонтёр</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 20px 40px;
      background: #0da96b;
      color: white;
      font-size: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .content {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin-bottom: 20px;
      color: #0da96b;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .card p {
      opacity: 0.75;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 20px;
      background: #0da96b;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:disabled {
      background: gray;
      cursor: default;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div>SAQTAS — Волонтёр</div>
  <div onclick="location.href='profile.html'" style="cursor:pointer;">Профиль</div>
</header>

<div class="content">
  <h2>Активные просьбы о помощи</h2>

  <div class="cards">

    <div class="card">
      <h3>Покупка продуктов</h3>
      <p>Купить продукты в «Small». Адрес: Абая 15.</p>
      <button class="help-btn">Помочь</button>
    </div>

    <div class="card">
      <h3>Получение лекарств</h3>
      <p>Забрать лекарства из аптеки №7. Срочно.</p>
      <button class="help-btn">Помочь</button>
    </div>

    <div class="card">
      <h3>Сопровождение</h3>
      <p>Помочь дойти до поликлиники завтра в 10:00.</p>
      <button class="help-btn">Помочь</button>
    </div>

  </div>
</div>

<footer>
  © 2025 SAQTAS — платформа помощи пожилым людям
</footer>

<script>
  const buttons = document.querySelectorAll(".help-btn");

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      alert("Заявка принята! Спасибо за помощь ❤️");

      btn.textContent = "Вы помогаете";
      btn.disabled = true;
    });
  });
</script>

</body>
</html>
