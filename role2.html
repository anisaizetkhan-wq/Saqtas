<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saqtas — Пожилой человек</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #eef0ef;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 20px 40px;
      background: #0da96b;
      color: white;
      font-size: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .content {
      flex: 1;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .form-box {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    h2 {
      color: #0da96b;
      margin-bottom: 20px;
      font-size: 28px;
    }

    label {
      font-size: 16px;
      margin-bottom: 6px;
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    textarea {
      height: 120px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #0da96b;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      flex-shrink: 0;
    }
  </style>

</head>
<body>

<header>
  <div>SAQTAS — Пожилой человек</div>
  <div onclick="location.href='profile.html'" style="cursor:pointer;">Профиль</div>
</header>

<div class="content">
  <div class="form-box">
    <h2>Создать просьбу о помощи</h2>

    <label>Тип помощи</label>
    <input type="text" placeholder="Например: покупка продуктов">

    <label>Адрес</label>
    <input type="text" placeholder="Ваш адрес">

    <label>Описание</label>
    <textarea placeholder="Опишите, что именно вам нужно..."></textarea>

    <button>Отправить запрос</button>
  </div>
</div>

<footer>
  © 2025 SAQTAS — платформа помощи пожилым людям
</footer>

</body>
</html>
