<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — SAQTAS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: url('leaves-bg.jpg') center/cover no-repeat;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

 
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 20px 40px;
      z-index: 10;
      background: rgba(0,0,0,0.3);
    }

    header .logo {
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    
    .container {
      margin-top: 90px; 
      margin-bottom: 60px; 
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 1000px;
      display: flex;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      min-height: 600px;
    }

    .left {
      width: 50%;
      padding: 50px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .left h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    .left p {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .right {
      width: 50%;
      background: rgba(0, 0, 0, 0.6);
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: white;
    }

    .switcher {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .switcher button {
      width: 48%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      background: rgba(255,255,255,0.15);
      color: white;
      transition: 0.2s;
    }

    .switcher button.active {
      background: #0da96b;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #ddd;
    }

    .submit-btn {
      margin-top: 10px;
      padding: 14px;
      background: #0da96b;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .login-link {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .login-link a {
      color: #0da96b;
      text-decoration: none;
    }

   
    footer {
      width: 100%;
      background: #111;
      padding: 20px 40px;
      color: white;
      text-align: center;
      font-size: 15px;
    }
  </style>

</head>
<body>

<header>
  <div class="logo" onclick="location.href='index.html'">SAQTAS</div>
</header>

<div class="container">
  <div class="register-box">

    <div class="left">
      <h1>Давайте начнём!</h1>
      <p>
        Создайте свой аккаунт SAQTAS и получайте или оказывайте помощь.
        Выберите тип — волонтёр или пожилой человек, затем заполните форму.
      </p>
    </div>

    <div class="right">

      <div class="switcher">
        <button id="volBtn" class="active" onclick="switchToVolunteer()">Волонтёр</button>
        <button id="eldBtn" onclick="switchToElder()">Пожилой</button>
      </div>

      
      <form id="volForm">
        <input type="text" placeholder="Ваше имя" required>
        <input type="email" placeholder="Ваш Email" required>
        <input type="password" placeholder="Пароль" required>
        <input type="password" placeholder="Повторите пароль" required>
        <button class="submit-btn" onclick="location.href='role.html'" type="button">
          Зарегистрироваться
        </button>
      </form>

      
      <form id="eldForm" style="display:none;">
        <input type="text" placeholder="Ваше имя" required>
        <input type="email" placeholder="Ваш Email" required>
        <input type="password" placeholder="Пароль" required>
        <input type="password" placeholder="Повторите пароль" required>
        <button class="submit-btn" onclick="location.href='role2.html'" type="button">
          Зарегистрироваться
        </button>
      </form>

      <div class="login-link">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </div>

    </div>

  </div>
</div>

<footer>
  © 2025 SAQTAS — платформа помощи пожилым людям. Все права защищены.
</footer>

<script>
  function switchToVolunteer() {
    document.getElementById('volBtn').classList.add('active');
    document.getElementById('eldBtn').classList.remove('active');
    document.getElementById('volForm').style.display = 'flex';
    document.getElementById('eldForm').style.display = 'none';
  }

  function switchToElder() {
    document.getElementById('eldBtn').classList.add('active');
    document.getElementById('volBtn').classList.remove('active');
    document.getElementById('eldForm').style.display = 'flex';
    document.getElementById('volForm').style.display = 'none';
  }
</script>

</body>
</html>
